name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git auth for private cross-repo installs
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
        run: |
          # Rewrite https://github.com/ to embed the PAT so pip-install-from-git
          # can clone private HolobiomicsLab repos (indicium, indicium-adapters).
          # Requires repo secret ORG_PAT — fine-grained PAT with Contents: Read
          # on HolobiomicsLab/{indicium, indicium-adapters}.
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # indicium and indicium-adapters aren't on PyPI yet; install from git.
          pip install git+https://github.com/HolobiomicsLab/indicium.git@main
          pip install git+https://github.com/HolobiomicsLab/indicium-adapters.git@main
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest --cov=indicium_adapters_transcriptomics --cov-report=term-missing
